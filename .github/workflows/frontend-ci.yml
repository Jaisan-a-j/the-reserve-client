name: Frontend Docker CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    steps:
      # --- PHASE 1: CONTINUOUS INTEGRATION (CI) ---
      - name: Checkout Code
        uses: actions/checkout@v4

      # We install Node and run local Vitest checks to catch bugs BEFORE wasting time building Docker images
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./package-lock.json"

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Unit & Integration Tests
        run: npm test run

      # --- PHASE 2: CONTINUOUS DEPLOYMENT (CD via DOCKER) ---
      # Set up Buildx provides advanced caching, making your cloud Docker builds much faster
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: . # Looks at the root of your frontend repo
          file: ./Dockerfile # Points to your frontend Dockerfile
          push: true # Tells it to upload to Docker Hub if the build succeeds
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/the-reserve:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/the-reserve:${{ github.sha }}
